MEMORY
{
  ZPSTACK:
    start  = $0002
    size   = $008e
    define = yes;

  ZPTEMP:
    start  = $fd
    size   = $03;

  BIN_HEADER:
    start  = $0000
    size   = $ffff
    file   = %O;

  ACHERON:
    start  = $1000
    size   = $2800
    file   = %O
    define = yes;

  INCFILE:
    start  = $0000
    size   = $ffffff
    file   = "build/generated_acheron.inc";

  OPDESC:
    start  = $0000
    size   = $ffffff
    file   = "build/generated_opdesc";
}

SEGMENTS
{
  DISPATCH: load = ACHERON, align = $0100;
  ACHERON:  load = ACHERON;
  CODE:     load = ACHERON;

  ZPSTACK:
    load   = ZPSTACK
    type   = zp;

  ZPTEMP:
    load   = ZPTEMP
    type   = zp;

  INCFILE_TOP:          load = INCFILE;
  INCFILE_IMPORTS:      load = INCFILE;
  INCFILE_PSEUDO:       load = INCFILE;
  INCFILE_OPCODES:      load = INCFILE;
  INCFILE_INSTRUCTIONS: load = INCFILE;
  INCFILE_BOTTOM:       load = INCFILE;

  OPDESC_:              load = OPDESC;
  BIN_HEADER:           load = BIN_HEADER;
}
