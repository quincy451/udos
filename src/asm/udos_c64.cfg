MEMORY
{
  BIN_HEADER:
    start  = $0000
    size   = $0002
    file   = %O;

  RESIDENT:
    start  = $1810
    size   = $87f0
    file   = %O
    define = yes;

  HIRAM:
    start  = $C000
    size   = $1000
    define = yes;
}

SEGMENTS
{
  BIN_HEADER: load = BIN_HEADER;
  CODE:       load = RESIDENT;
  HIRAM:
    load   = HIRAM
    type   = bss;
}
